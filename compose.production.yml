name: perdtu-production

x-backend-image: &backend-image
  image: ${IMAGE_REGISTRY:-perdtu}/backend:${IMAGE_TAG:-local}
  build:
    context: ./backend
    target: runtime

services:
  migrate:
    image: ${IMAGE_REGISTRY:-perdtu}/migrate:${IMAGE_TAG:-local}
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/.env.production}
    restart: "no"
    init: true
    volumes:
      - ./deploy/certs:/run/perdtu-certs:ro

  backend:
    <<: *backend-image
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/.env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env.production}
      WEB_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/.env.production}
      PUBLIC_API_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/.env.production}
      PORT: "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/storage/uploads
      - models:/app/storage/models:ro
      - ./deploy/certs:/run/perdtu-certs:ro
    expose: ["4000"]

  frontend:
    image: ${IMAGE_REGISTRY:-perdtu}/frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/.env.production}
    restart: unless-stopped
    init: true
    expose: ["3000"]

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  ai-setup:
    <<: *backend-image
    profiles: ["tools"]
    command: ["node", "scripts/setup-matching-model.mjs"]
    init: true
    restart: "no"
    volumes:
      - models:/app/storage/models

volumes:
  uploads:
  models:
